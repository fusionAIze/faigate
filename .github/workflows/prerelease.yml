name: Prerelease — filtered release notes

# Runs on tag push, before release-artifacts.yml builds the dist.
#
# This workflow does not write a release object. The ops-engine creates the
# release on tag_push, resolving every destination from the committed .ops.yaml;
# the repo-local `gh release create/edit` that used to run here was a second
# writer of the same release object, so the step is gone. What remains is the
# content-boundary check: git-cliff generates the notes, then
# .github/scripts/filter-changelog.py strips lines that mention non-faigate
# topics (personal tooling, local setup details), and the filtered result is
# kept as a workflow artifact for an operator to read.
#
# The notes are generated with --current, not --unreleased. The workflow is
# triggered BY the tag push, so by the time git-cliff runs the tag already
# exists and nothing is unreleased: --unreleased produced an empty body, which
# is how v2.10.0 came to be published with no release notes at all.
#
# Content boundary policy lives in .github/scripts/filter-changelog.py
# and is documented in AGENTS.md → "Content boundary".

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)generate notes for"
        required: true
        type: string

permissions:
  contents: read

jobs:
  filtered-notes:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      # On a tag push the default checkout is already the tag. On a
      # workflow_dispatch it is the default branch, and --current would then
      # describe whatever tag the default branch carries - the notes of a
      # different release, labelled as the requested one, which reads correct
      # and is not. Pin the checkout to the requested tag, the way notify-tap
      # already does.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve target tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          version: latest
          config: .cliff.toml
          args: --tag ${{ steps.tag.outputs.ref }} --strip header --current
        env:
          OUTPUT: raw-notes.md

      - name: Self-test the filter
        run: python3 .github/scripts/filter-changelog.py --self-test

      - name: Apply content-boundary filter
        run: |
          python3 .github/scripts/filter-changelog.py raw-notes.md > filtered-notes.md
          echo "--- raw notes ---"
          wc -l raw-notes.md
          echo "--- filtered notes ---"
          wc -l filtered-notes.md
          echo "--- filtered preview ---"
          head -40 filtered-notes.md

      - name: Upload filtered notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: filtered-release-notes
          path: |
            raw-notes.md
            filtered-notes.md
          retention-days: 30

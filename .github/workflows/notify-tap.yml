name: Notify Homebrew Tap

on:
  release:
    # `edited` lets a `gh release edit --title` retroactively unblock the
    # title-convention check after a `published` event failed validation,
    # without needing to delete and recreate the release.
    types: [published, edited]
  # `edited` already lets a retroactive title fix re-fire the workflow, but only
  # when something on the release CHANGES. It cannot re-run an untouched release
  # whose dispatch failed for a reason OUTSIDE the release - an expired
  # TAP_GITHUB_TOKEN being the case that prompted this, which left three faigrid
  # releases unannounced with no way to catch up short of cutting another one.
  #
  # The release-object rule is not weakened: a manual run resolves the given tag
  # as a release and refuses a tag that has none, so a tag the gate refused stays
  # undispatchable by hand exactly as it is automatically.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an ALREADY PUBLISHED release to re-notify, e.g. v2.9.3"
        required: true
        type: string

jobs:
  notify:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      # The title convention lives in .release-title-prefix so this gate and the
      # Forgejo one cannot drift apart. Reading it needs the repo on disk.
      # The ref must follow the same tag the rest of the job resolves. On a
      # workflow_dispatch `github.event.release` is empty, which would silently
      # check out the default branch and read a prefix that may not be the one
      # that tag was released under.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

      # Resolve BEFORE validating. The title check below reads the release
      # object, and on a workflow_dispatch `github.event.release` is empty - so
      # validating first would fail every manual run with an empty title rather
      # than checking anything.
      - name: Resolve the released tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          # A manual run must not be able to invent a version: the tag is looked
          # up as a release, and a tag with no release object fails here by name.
          NAME="$(gh release view "$TAG" --repo "${{ github.repository }}" --json name -q .name 2>/dev/null)" || {
            echo "::error::No published release exists for tag ${TAG} - nothing to re-notify."
            exit 1
          }
          echo "tag=${TAG}"   >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Validate release title convention
        # Required format: "fusionAIze Gate vX.Y.Z"  (no subtitle)
        # Read from the resolved release object, so the gate is real on BOTH the
        # automatic and the manual path.
        run: |
          TITLE="${{ steps.tag.outputs.name }}"
          PREFIX="$(cat .release-title-prefix)"
          if echo "$TITLE" | grep -qE "^${PREFIX} v[0-9]+\.[0-9]+\.[0-9]+$"; then
            echo "Release title OK: $TITLE"
          else
            echo "::error::Release title must be exactly 'fusionAIze Gate vX.Y.Z'. Got: $TITLE"
            echo "::error::Fix: gh release edit ${{ steps.tag.outputs.tag }} --repo fusionAIze/faigate --title 'fusionAIze Gate ${{ steps.tag.outputs.tag }}'"
            exit 1
          fi

      - name: Compute SHA256
        id: sha
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          VERSION="${VERSION#v}"
          URL="https://github.com/fusionAIze/faigate/archive/refs/tags/v${VERSION}.tar.gz"
          SHA=$(curl -sL "$URL" | sha256sum | awk '{print $1}')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}"      >> "$GITHUB_OUTPUT"

      - name: Dispatch to homebrew-tap
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TAP_GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'fusionAIze',
              repo:  'homebrew-tap',
              event_type: 'formula-update',
              client_payload: {
                formula: 'faigate',
                version: '${{ steps.sha.outputs.version }}',
                sha256:  '${{ steps.sha.outputs.sha256 }}',
              },
            });
            console.log('Dispatched formula-update for faigate v${{ steps.sha.outputs.version }}');

name: Gate the Forgejo Release

# Forgejo is canonical; GitHub is the public mirror. Nothing in this file
# creates, edits or deletes a release object on either forge. The release
# object belongs to the ops-engine, which creates it on tag_push from the
# layover's configuration. The repository-side writer that used to call
# ReleaseHandler.publish_release here aimed at that same object: the first
# create won and the second returned 409/422. The writer is gone; the gates stay.
#
# Which engine version runs is the layover's pin, not this file's —
# fusionaize-ops declares it in pyproject.toml and this workflow installs
# nothing from the engine. What the engine does with the tag therefore follows
# that pin. At ops-engine 3.6.2 (P36-021) the engine resolves the title
# template from the repository's own .ops.yaml `release.name_template`, refuses
# a tag with no CHANGELOG section instead of posting commit subjects, and
# resolves every destination before writing. An older pin does less; the steps
# below are this repository's own gates and hold either way, so a tag that
# would publish under the wrong name or with no authored notes stops here
# first.
#
# The gates below write no release object:
#   title      -> must be exactly "<prefix> vX.Y.Z" (or -rcN), not the bare tag
#   body       -> the notes are the CHANGELOG section for the tag; a version with
#                 no section is refused instead of publishing commit subjects
#   audience   -> a section that names an internal ticket is refused
#   literal \n -> the notes never pass through printf; they cross steps as a
#                 heredoc-delimited GITHUB_OUTPUT value
#
# Artifact publication is untouched and does not depend on this file:
# .github/workflows/release-artifacts.yml builds dist, GHCR and PyPI,
# notify-tap.yml updates the Homebrew tap, and both trigger on the tag push.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to check (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      # The release title is a gate, not an agreement. It must be exactly
      # "fusionAIze Gate vX.Y.Z"; a tag whose rendered title does not conform is
      # refused here, before the engine creates any release object on either
      # forge. Forge default behaviour names a release after the bare tag — that
      # is not the convention, and v1.5.2's title had to be corrected by hand
      # because of it.
      - name: Gate the release title
        env:
          TAG_NAME: "${{ github.event.inputs.tag_name || github.ref_name }}"
        run: |
          set -euo pipefail
          PREFIX="$(cat .release-title-prefix)"
          RELEASE_NAME="${PREFIX} ${TAG_NAME}"
          python3 - "${RELEASE_NAME}" "${PREFIX}" <<'TITLE_GATE_PY'
          import re
          import sys

          name, prefix = sys.argv[1], sys.argv[2]
          NAME_RE = re.compile(
              r"^%s v[0-9]+\.[0-9]+\.[0-9]+(?:-rc[0-9]+)?$" % re.escape(prefix)
          )
          if not NAME_RE.match(name):
              sys.stderr.write(
                  "ReleaseTitleError: release name %r does not match the required "
                  "convention ^fusionAIze Gate v[0-9]+\\.[0-9]+\\.[0-9]+$ or its "
                  "prerelease form ...-rc[0-9]+$. Refusing before any release "
                  "object exists on either forge.\n" % name
              )
              sys.exit(2)
          sys.stdout.write("title gate: %r conforms\n" % name)
          TITLE_GATE_PY

      # The release body is the CHANGELOG entry for this version, never commit
      # subjects. A tag whose version has no section fails here, before the
      # engine creates any release object — which is the correct outcome: a
      # release with no authored notes is a release nobody can read.
      #
      # The extractor carries its own copy of the ops-engine heading pattern
      # (`release_gates.py`, pinned below) and is stdlib-only on purpose:
      # importing ops_engine here would pull yaml and pydantic, which the bare
      # runner image does not carry. The pattern accepts every form CHANGELOG.md
      # uses: `## v1.5.2 (2026-09-02)`, `## v1.3.13 (2026-08-31) — Dynamic
      # Routing and Anti-Masking`, and the bracketed `## [2.1.2] — ...`.
      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          TAG_NAME: "${{ github.event.inputs.tag_name || github.ref_name }}"
        run: |
          set -euo pipefail

          NOTES="$(python3 - "$TAG_NAME" <<'PY'
          import re
          import sys

          HEADER_PATTERN = re.compile(
              r"^##\s+"
              r"(?:\[)?(?:[\w-]+\s+)?v?"
              r"(\d+\.\d+\.\d+(?:[-.\w]*)?)"
              r"(?:\])?"
              r".*$",
              re.MULTILINE,
          )

          tag = sys.argv[1]
          version = tag.lstrip("v")
          with open("CHANGELOG.md", encoding="utf-8") as fh:
              content = fh.read()
          matches = list(HEADER_PATTERN.finditer(content))
          target_match = None
          target_idx = -1
          for idx, m in enumerate(matches):
              if m.group(1) == version:
                  target_match = m
                  target_idx = idx
                  break
          if target_match is None:
              notes = ""
          else:
              start = target_match.end()
              if target_idx + 1 < len(matches):
                  end = matches[target_idx + 1].start()
              else:
                  end = len(content)
              notes = content[start:end].strip()
          if not notes:
              sys.stderr.write(
                  "MissingChangelogEntryError: no '## %s' section in CHANGELOG.md; "
                  "a release with no notes would post commit subjects, so the "
                  "release is refused.\n" % version
              )
              sys.exit(2)
          sys.stdout.write(notes)
          PY
          )"

          {
            echo "notes<<EOF"
            echo "${NOTES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Generic tooling lives in the open base. ops-engine is OSS and publicly
      # mirrored, so this needs no credential — the same fetch the version gate
      # in mirror.yml already uses.
      #
      # Pinned to the v3.6.2 tag, the engine version the layover declares. An
      # earlier revision of this workflow pinned a commit instead, because the
      # mirror's v3.4.0 tag pointed twenty commits behind the canonical one and
      # installing from it delivered 3.4.0's name with 3.3.0's code. ops-engine
      # closed that at its source: its own release job pushes the canonical tag
      # ref onto the mirror before publishing and refuses by name when the two
      # peel to different commits. Measured here: v3.6.2 targets
      # 01ca1cc1e437969d178023fe85edf8777f4ef0c1 on both forges. The tag is a
      # fixed point again, so the pin follows it.
      #
      # TWO files, because since OE-007 the script is no longer self-contained:
      # it loads `check_release_notes_audience` from
      # `src/ops_engine/modules/release_gates.py` by a path relative to its own
      # location, and carries no copy of the ticket check. Fetching only the
      # script would fail at import time; fetching both into the same relative
      # layout keeps the engine's own gate authoritative instead of
      # reintroducing a private copy of the ticket regex.
      - name: Fetch the audience gate (canonical, ops-engine)
        run: |
          set -euo pipefail
          GATE_ROOT="$RUNNER_TEMP/ops-engine-gate"
          mkdir -p "$GATE_ROOT/scripts" "$GATE_ROOT/src/ops_engine/modules"
          BASE="https://raw.githubusercontent.com/LangeVC/ops-engine/v3.6.2"
          curl -fsSL "$BASE/scripts/release_notes_audience_gate.py" \
            -o "$GATE_ROOT/scripts/release_notes_audience_gate.py"
          curl -fsSL "$BASE/src/ops_engine/modules/release_gates.py" \
            -o "$GATE_ROOT/src/ops_engine/modules/release_gates.py"

          # Prove what arrived. Without this the step reports success even when
          # it fetched an HTML page: a redirect to a login page returns 200 and
          # curl -f never triggers, so the failure surfaces later as a
          # SyntaxError on "<!DOCTYPE html>". Both files are parsed; the gate
          # resolves the second by its path relative to the first, so a syntax
          # error in either is a broken gate.
          for fetched in \
            "$GATE_ROOT/scripts/release_notes_audience_gate.py" \
            "$GATE_ROOT/src/ops_engine/modules/release_gates.py"; do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$fetched" \
              || { echo "fetched file is not Python — first three lines:"; \
                   head -3 "$fetched"; exit 1; }
          done

      # The release body is addressed at an external reader. A section that
      # still names an internal ticket addresses the tracker that produced the
      # release, not the consumer the body is for.
      #
      # The engine classifies nothing by shape: the code-and-number form is
      # shared by internal ticket ids and by identifiers a reader legitimately
      # needs (CVE, RFC, ISO, PEP-8, UTF-8, SHA-256, TLS-1.3). It refuses a
      # ticket-shaped token only when its prefix appears in the vocabulary THIS
      # repository declares. That vocabulary is a committed file rather than a
      # shell literal because it was derived by measurement — the prefixes that
      # actually occur in this repository's commit subjects and changelog — and
      # a reviewer must be able to see and change the list.
      - name: Gate the release notes for an external audience
        env:
          NOTES: "${{ steps.notes.outputs.notes }}"
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          PREFIXES_FILE="$(mktemp)"
          trap 'rm -f "$NOTES_FILE" "$PREFIXES_FILE"' EXIT
          printf '%s\n' "$NOTES" > "$NOTES_FILE"
          python3 - "$PREFIXES_FILE" <<'PREFIXES_PY'
          import sys
          from pathlib import Path

          out = sys.argv[1]
          prefixes = []
          ops = Path(".ops.yaml")
          if ops.exists():
              for raw in ops.read_text(encoding="utf-8").splitlines():
                  line = raw.split("#", 1)[0].strip()
                  if not line.startswith("tracker_prefixes:"):
                      continue
                  value = line[len("tracker_prefixes:"):].strip()
                  if value.startswith("[") and value.endswith("]"):
                      value = value[1:-1]
                  for item in value.split(","):
                      item = item.strip().strip("'\"")
                      if item:
                          prefixes.append(item)
          Path(out).write_text("\n".join(prefixes) + ("\n" if prefixes else ""),
                               encoding="utf-8")
          PREFIXES_PY
          python3 "$RUNNER_TEMP/ops-engine-gate/scripts/release_notes_audience_gate.py" \
            --ticket-prefixes "$PREFIXES_FILE" \
            "$NOTES_FILE"

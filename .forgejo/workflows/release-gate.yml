name: Release gate

# One gate, one code path. A stable release tag and an rc (prerelease) tag
# traverse this same workflow and the same gate invocation. The only
# difference is one derived flag: a prerelease tag is permitted, a stable tag
# is not. A mismatched version turns the run red here, before any release
# object exists.
#
# REL-010 — the OSV gate no longer lives here. It used to poll for the release
# and re-download the sbom.cdx.json asset over the network (REL-009), a second
# acquisition of bytes the build had already produced. That scan now runs
# inside forgejo-release.yml over the SBOM the same build produced, BEFORE any
# release object is created. This file keeps only the boundary and version
# gates, which consume no release asset and carry no ordering dependency, so
# there is nothing here to poll for.
#
# ADP-009 — the destination boundary runs here. The destination a release
# reaches must come from the config layer (.ops.yaml), never from a user-defined
# CI variable (vars.*) and never from a hardcoded forge repository or API host in
# a workflow under .forgejo/. scripts/ci_variable_boundary_gate.py is that gate:
# it scans every workflow below .forgejo and refuses, with a named error, the two
# shapes that took a destination outside the config layer. Secrets (credentials,
# not destinations) and Forgejo-provided event context (github.* — the event, not
# a user variable store) are permitted. A deliberately reintroduced destination
# therefore fails THIS build at tag time, before the release step in
# forgejo-release.yml can publish anywhere.
#
# The gate ships the UNIVERSAL destination-host set only (github.com,
# www.github.com, gitlab.com, codeberg.org, git.sr.ht — the public forges any
# adopter recognises). An organisation's own forge host is organisation
# knowledge, so it is not shipped in the gate: it arrives via --dest-hosts, the
# same shape --org-vocab and --ci-env take on the src/ side. This workflow
# reads the organisation's forge host from the config layer (.ops.yaml's
# forge_hosts) — the same place every other piece of organisation vocabulary
# lives — rather than deriving it from github.server_url, which names the
# runner's own internal container address (http://forgejo:3000), not the
# organisation's forge. A forge_hosts entry with no dot is refused by name by
# the gate, before the scan runs, so an internal label can never become the
# organisation's forge. A forge_hosts declared by neither the layover nor
# .ops.yaml is the explicit nothing-to-do default the same shape an absent
# tracker-prefix list takes; the gate still refuses the universal set.
#
# ADP-010 — the Layer-1 boundary runs here too. The engine's own Python source
# (src/) must know no organisation and no CI system: an organisation name as a
# live value, a direct CI-environment read, or an organisation forge host as a
# live value (ADP-014) belongs in the calling layer, never in the engine. The
# same gate script scans src/ with ast and refuses any of the three shapes,
# naming file and line. Its vocabulary arrives from THIS workflow (the config
# layer), never shipped in the gate: the organisation names, the CI variable
# names, and the forge hosts a LangeVC engine must not carry are read from
# .ops.yaml below. A docstring or comment naming the same organisation, host,
# or variable is documentation and passes; a live value fails before any
# release step can publish. The forge host is read from .ops.yaml's forge_hosts
# — the same config-layer value the destination gate reads — so no organisation
# host literal lives here.
#
# The Layer-1 gate also scans scripts/. The operator tools (scripts/) are the
# calling layer, not the engine, so they may name the organisation they operate
# on and read a CI variable the workflow hands them — the org-name and ci-env
# shapes are not enforced there. But they must still receive the organisation's
# forge base URL as input, never default it: the ADP-014 defect lived in
# scripts/mirror-destination-propose.py, so the org-host shape IS enforced over
# scripts/ too. The gate script records this tree decision (operator-tool and
# test carve-outs), so the scan and the wiring agree on what each tree may name.
on:
  push:
    tags: ["v*"]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Refuse a forge destination outside the config layer
        run: |
          set -euo pipefail
          DEST_HOSTS="$(mktemp)"
          trap 'rm -f "$DEST_HOSTS"' EXIT
          python3 - "$DEST_HOSTS" <<'FORGE_HOSTS_PY'
          import sys
          from pathlib import Path

          out = sys.argv[1]
          hosts = []
          ops = Path(".ops.yaml")
          if ops.exists():
              for raw in ops.read_text(encoding="utf-8").splitlines():
                  line = raw.split("#", 1)[0].strip()
                  if not line.startswith("forge_hosts:"):
                      continue
                  value = line[len("forge_hosts:"):].strip()
                  if value.startswith("[") and value.endswith("]"):
                      value = value[1:-1]
                  for item in value.split(","):
                      item = item.strip().strip("'\"")
                      if item:
                          hosts.append(item)
          Path(out).write_text("\n".join(hosts) + ("\n" if hosts else ""),
                               encoding="utf-8")
          FORGE_HOSTS_PY
          python3 scripts/ci_variable_boundary_gate.py --dir .forgejo \
            --dest-hosts "$DEST_HOSTS"
      - name: Refuse a Layer-1 boundary bypass (org name or CI env read in src)
        run: |
          set -euo pipefail
          ORG_VOCAB="$(mktemp)"
          CI_ENV_VOCAB="$(mktemp)"
          DEST_HOSTS="$(mktemp)"
          trap 'rm -f "$ORG_VOCAB" "$CI_ENV_VOCAB" "$DEST_HOSTS"' EXIT
          printf '%s\n' Capacium capacium capacium-ops LangeVC langevc lvc-ops \
            > "$ORG_VOCAB"
          printf '%s\n' GITHUB_REPOSITORY GITHUB_TOKEN > "$CI_ENV_VOCAB"
          python3 - "$DEST_HOSTS" <<'FORGE_HOSTS_PY'
          import sys
          from pathlib import Path

          out = sys.argv[1]
          hosts = []
          ops = Path(".ops.yaml")
          if ops.exists():
              for raw in ops.read_text(encoding="utf-8").splitlines():
                  line = raw.split("#", 1)[0].strip()
                  if not line.startswith("forge_hosts:"):
                      continue
                  value = line[len("forge_hosts:"):].strip()
                  if value.startswith("[") and value.endswith("]"):
                      value = value[1:-1]
                  for item in value.split(","):
                      item = item.strip().strip("'\"")
                      if item:
                          hosts.append(item)
          Path(out).write_text("\n".join(hosts) + ("\n" if hosts else ""),
                               encoding="utf-8")
          FORGE_HOSTS_PY
          python3 scripts/ci_variable_boundary_gate.py \
            --py-dir src \
            --org-vocab "$ORG_VOCAB" \
            --ci-env "$CI_ENV_VOCAB" \
            --dest-hosts "$DEST_HOSTS"
          python3 scripts/ci_variable_boundary_gate.py \
            --py-dir scripts \
            --org-vocab "$ORG_VOCAB" \
            --ci-env "$CI_ENV_VOCAB" \
            --dest-hosts "$DEST_HOSTS"
      - name: Check tag against the declared version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF##refs/tags/}"
          args=(check-tag "$tag")
          version="${tag#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            args+=(--allow-prereleases)
          fi
          python3 scripts/version-sync.py "${args[@]}"
